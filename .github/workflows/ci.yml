name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test, Typecheck, Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint & format
        run: pnpm check
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test

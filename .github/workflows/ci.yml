name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test, Typecheck, Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Lint & format
        run: npm run check
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
